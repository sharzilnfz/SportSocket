<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportSocket | WebSocket Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #22c55e;
            --error: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
            box-shadow: 0 0 12px var(--error);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-bottom: 24px;
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        button {
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.disconnect {
            background: var(--error);
            color: white;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            height: 300px;
            overflow-y: auto;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .log-entry {
            display: flex;
            gap: 12px;
            opacity: 0;
            animation: slideIn 0.3s forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
            from { opacity: 0; transform: translateX(-10px); }
        }

        .log-time { color: var(--text-dim); }
        .log-direction { font-weight: 600; }
        .log-msg-in { color: var(--success); }
        .log-msg-out { color: var(--primary); }
        .log-msg-sys { color: #eab308; font-style: italic; }

        .message-box {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WebSocket Lab 🚀</h1>
            <div id="statusBadge" class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="wsUrl" value="ws://localhost:8080" placeholder="ws://url:port">
            <button id="connectBtn">Connect</button>
        </div>

        <div id="terminal" class="terminal">
            <div class="log-entry sys">
                <span class="log-time">System</span>
                <span class="log-msg-sys">Welcome. Enter URL and click 'Connect' to start.</span>
            </div>
        </div>

        <div class="message-box">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script>
        const wsUrlInput = document.getElementById('wsUrl');
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const terminal = document.getElementById('terminal');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let socket = null;

        function log(message, type = 'sys') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            let label = '';
            let contentClass = '';
            
            if (type === 'in') { label = '←'; contentClass = 'log-msg-in'; }
            else if (type === 'out') { label = '→'; contentClass = 'log-msg-out'; }
            else { label = '•'; contentClass = 'log-msg-sys'; }

            entry.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-direction">${label}</span>
                <span class="${contentClass}">${message}</span>
            `;
            
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function updateUI(connected) {
            if (connected) {
                statusDot.classList.add('connected');
                statusText.innerText = 'Connected';
                connectBtn.innerText = 'Disconnect';
                connectBtn.classList.add('disconnect');
                messageInput.disabled = false;
                sendBtn.disabled = false;
                wsUrlInput.disabled = true;
            } else {
                statusDot.classList.remove('connected');
                statusText.innerText = 'Disconnected';
                connectBtn.innerText = 'Connect';
                connectBtn.classList.remove('disconnect');
                messageInput.disabled = true;
                sendBtn.disabled = true;
                wsUrlInput.disabled = false;
            }
        }

        connectBtn.onclick = () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
                return;
            }

            const url = wsUrlInput.value;
            try {
                socket = new WebSocket(url);
                log(`Attempting to connect to ${url}...`);

                socket.onopen = () => {
                    log('Connection established!', 'sys');
                    updateUI(true);
                };

                socket.onmessage = (event) => {
                    log(event.data, 'in');
                };

                socket.onclose = () => {
                    log('Disconnected from server.', 'sys');
                    updateUI(false);
                };

                socket.onerror = (error) => {
                    log('Socket error occurred.', 'sys');
                    console.error('WebSocket Error:', error);
                };
            } catch (err) {
                log(`Invalid URL: ${err.message}`, 'sys');
            }
        };

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(msg);
                log(msg, 'out');
                messageInput.value = '';
            }
        }

        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
    </script>
</body>
</html>
